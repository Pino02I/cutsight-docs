# Read the Docs configuration — cutSIGHT 1.0.0
# The Sphinx sources live in the repository root, so `configuration` points at
# ./conf.py. If you ever move them into a subfolder, change this line too.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: conf.py

python:
  install:
    - requirements: requirements.txt

formats:
  - pdf
  - htmlzip
